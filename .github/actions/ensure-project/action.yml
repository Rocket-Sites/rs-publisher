name: Ensure Cloudflare Pages project (direct upload)
description: |
  Create the Pages project on first deploy, reject a Git-connected project with
  an actionable message instead of wrangler's opaque one, and record whether
  THIS run's own create call brought the project into existence.

  The `created` output is the only thing that ever permits the gated post-deploy
  check to delete a project. It is recorded here because this is the only step
  that knows, and it is never inferred from another signal.

inputs:
  project-name:
    description: Cloudflare Pages project name
    required: true
  cf-api-token:
    description: Cloudflare API token
    required: true
  cf-account-id:
    description: Cloudflare account id
    required: true

outputs:
  created:
    description: "true only when this run's own POST created the project"
    value: ${{ steps.run.outputs.created }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cf-account-id }}
      run: node "${{ github.action_path }}/ensure-project.mjs"
