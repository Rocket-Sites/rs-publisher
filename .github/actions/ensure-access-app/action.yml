name: Ensure the Cloudflare Access gate (gated mode)
description: |
  GATED MODE ONLY. Resolve the domain the Pages project is really served at,
  then guarantee an Access application covers both that domain and *.<domain>,
  before anything is published. Fails the run when it cannot -- no Access app,
  no publish.

  Refuses outright when the project carries a custom domain: an Access app
  covers only the hosts it names, so a gate over <project>.pages.dev proves
  nothing about client.com (ARCHITECTURE.md invariant 10).

  This action never deletes an Access app. Removing a gate belongs to public
  mode and nowhere else.

inputs:
  project-name:
    description: Cloudflare Pages project name
    required: true
  cf-api-token:
    description: Cloudflare API token
    required: true
  cf-account-id:
    description: Cloudflare account id
    required: true

outputs:
  domain:
    description: "The domain the site is really served at. Exported before any create attempt, so a later failure still leaves the post-deploy check probing the right host."
    value: ${{ steps.run.outputs.domain }}
  app-id:
    description: Cloudflare Access application id covering the domain
    value: ${{ steps.run.outputs.app-id }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cf-account-id }}
      run: node "${{ github.action_path }}/ensure-access-app.mjs"
