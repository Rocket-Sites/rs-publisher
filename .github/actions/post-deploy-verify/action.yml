name: Post-deploy proof
description: |
  Prove the live site is in the state the caller declared, and act only on proof.

  gated  -- an unauthenticated request must redirect to the Access login. A 200
            served for the whole window is proven exposure: roll production back,
            or delete the project when this run created it and there is nothing
            to roll back to. Anything else proves neither, so the Access API is
            asked instead and nothing is destroyed.
  public -- an unauthenticated request must return 200 AND a body carrying this
            repo's <meta name="source-repo">. A redirect, or an Access app
            covering the domain, is a proven lock: remove the app. Never roll
            back and never delete the project -- a rollback cannot un-gate a
            site, it just serves yesterday's content from behind the same gate.

  One action drives both branches so the seam between them is a `case` a test can
  read, not two files that drift.

inputs:
  mode:
    description: public | gated
    required: true
  project-name:
    description: Cloudflare Pages project name
    required: true
  repo:
    description: owner/repo being published, matched against the live page's meta
    required: true
  domain:
    description: Domain resolved before the deploy, used only if the project cannot be re-read
    required: false
    default: ""
  custom-domain:
    description: |
      Optional. The hostname the caller declared this site is canonically served
      at. Discovery over the Pages API runs regardless; this exists so that a
      declaration the project contradicts fails the run instead of being guessed
      around (public mode only -- gated refuses a custom domain outright).
    required: false
    default: ""
  project-created-here:
    description: "true only when this run's own POST created the Pages project. Gates project deletion."
    required: false
    default: "false"
  cf-api-token:
    description: Cloudflare API token
    required: true
  cf-account-id:
    description: Cloudflare account id
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PROJECT_NAME: ${{ inputs.project-name }}
        REPO: ${{ inputs.repo }}
        DOMAIN_HINT: ${{ inputs.domain }}
        CUSTOM_DOMAIN: ${{ inputs.custom-domain }}
        PROJECT_CREATED_HERE: ${{ inputs.project-created-here }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cf-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cf-account-id }}
      run: node "${{ github.action_path }}/post-deploy-verify.mjs"
